name: Build StreamAudit 1.2 Universal APK
on:
  push:
    branches: [streamaudit-v1-2-build-temp]
    paths:
      - 'streamaudit-v1-2/**'
      - '.github/workflows/streamaudit-v1-2-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat streamaudit-v1-2/chunk_00.b64               streamaudit-v1-2/chunk_01a.b64               streamaudit-v1-2/chunk_01b.b64               streamaudit-v1-2/chunk_02.b64               streamaudit-v1-2/chunk_03.b64               streamaudit-v1-2/chunk_04.b64               streamaudit-v1-2/chunk_05.b64               streamaudit-v1-2/chunk_06.b64               streamaudit-v1-2/chunk_07.b64 > source.b64
          test "$(wc -c < source.b64)" -eq 60868
          base64 -d source.b64 > StreamAudit-Training-1.2.0-universal-source.zip
          echo "caf73da7181cdbb74d7128c654292ecf0e32ee697575dd6e62774046106ad016  StreamAudit-Training-1.2.0-universal-source.zip" | sha256sum -c -
          unzip -q StreamAudit-Training-1.2.0-universal-source.zip
          sed -i 's/ android:useController="false"//g' streamaudit_universal_v1_1/app/src/main/res/layout/activity_multiview.xml
          test -f streamaudit_universal_v1_1/app/build.gradle
          test -f streamaudit_universal_v1_1/app/src/main/AndroidManifest.xml

      - name: Build universal Android + Fire TV APK
        working-directory: streamaudit_universal_v1_1
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=streamaudit_universal_v1_1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: StreamAudit-Training-1.2.0-Universal-APK
          path: streamaudit_universal_v1_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
