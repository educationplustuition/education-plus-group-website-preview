name: Build KILLER DS Android APK

on:
  push:
    branches:
      - killer-ds-build
    paths:
      - '.github/workflows/killer-ds-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch verified KILLER DS 1.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprukwest.oaiusercontent.com/files/00000000-3638-8243-b07f-093b5f6501d9/raw?se=2026-09-30T23%3A41%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=6689efa8-e239-51d0-86b6-1e57e3279039&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T21%3A23%3A34Z&ske=2026-10-01T21%3A23%3A34Z&sks=b&skv=2026-02-06&sig=m%2BvscmEdZEYITcdON5lOxXVb2PfwZhJ2mo8%2B2fESk4Q%3D' --output killer-ds-source.zip
          echo "9bbfd3e4b7c811bf8a613050ad38e645dd289598611fb9f59615efecce68ee99  killer-ds-source.zip" | sha256sum -c -
          rm -rf killer-ds-android
          mkdir -p killer-ds-android
          unzip -q killer-ds-source.zip -d killer-ds-android
          test -f killer-ds-android/app/build.gradle
          test -f killer-ds-android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: killer-ds-android
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK=killer-ds-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" KILLER-DS-Android-1.2.1.apk
          sha256sum KILLER-DS-Android-1.2.1.apk | tee KILLER-DS-Android-1.2.1.sha256

      - name: Publish verified APK on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p killer-ds-release
          cp KILLER-DS-Android-1.2.1.apk killer-ds-release/
          cp KILLER-DS-Android-1.2.1.sha256 killer-ds-release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f killer-ds-release/KILLER-DS-Android-1.2.1.apk killer-ds-release/KILLER-DS-Android-1.2.1.sha256
          if git diff --cached --quiet; then
            echo "Verified release files already current"
          else
            git commit -m "release: KILLER DS Android 1.2.1"
            git push origin HEAD:killer-ds-build
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KILLER-DS-Android-1.2.1
          path: |
            KILLER-DS-Android-1.2.1.apk
            KILLER-DS-Android-1.2.1.sha256
          if-no-files-found: error
          retention-days: 30
