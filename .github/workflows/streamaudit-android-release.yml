name: Publish StreamAudit Android APK

on:
  push:
    branches: [streamaudit-public-android-download]
    paths:
      - '.github/workflows/streamaudit-android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat streamaudit-universal/chunk_000.b64 \
              streamaudit-universal/chunk_001.b64 \
              streamaudit-universal/chunk_002.b64 \
              streamaudit-universal/chunk_003.b64 \
              streamaudit-universal/chunk_004.b64 \
              streamaudit-universal/chunk_005.b64 \
              streamaudit-universal/chunk_006.b64 \
              streamaudit-universal/chunk_007.b64 > source.b64
          base64 -d source.b64 > source.zip
          echo "e0eb4ff0df4811aace540f67323a2f39208fe9f734f8c09bdfdf3c6e62d4ae9c  source.zip" | sha256sum -c -
          unzip -q source.zip
          sed -i 's/ android:useController="false"//g' streamaudit_universal_v1_1/app/src/main/res/layout/activity_multiview.xml

      - name: Build APK
        working-directory: streamaudit_universal_v1_1
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare public APK
        shell: bash
        run: |
          set -euo pipefail
          cp streamaudit_universal_v1_1/app/build/outputs/apk/debug/app-debug.apk StreamAudit-Training-Android.apk
          unzip -t StreamAudit-Training-Android.apk >/dev/null
          sha256sum StreamAudit-Training-Android.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete streamaudit-android-v1.1.0 --yes || true
          gh release create streamaudit-android-v1.1.0 \
            StreamAudit-Training-Android.apk \
            --title "StreamAudit Training Android 1.1.0" \
            --notes "Direct Android APK download. Clean-room training build. No IPTV account required for the built-in demonstration catalogue." \
            --target "${{ github.sha }}"
