name: Build StreamAudit Universal APK
on:
  push:
    branches: [streamaudit-universal-build-temp]
    paths:
      - 'streamaudit-universal/**'
      - '.github/workflows/streamaudit-universal-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct universal source
        shell: bash
        run: |
          set -euo pipefail
          cat streamaudit-universal/chunk_000.b64               streamaudit-universal/chunk_001.b64               streamaudit-universal/chunk_002.b64               streamaudit-universal/chunk_003.b64               streamaudit-universal/chunk_004.b64               streamaudit-universal/chunk_005.b64               streamaudit-universal/chunk_006.b64               streamaudit-universal/chunk_007.b64 > streamaudit-universal-source.b64
          base64 -d streamaudit-universal-source.b64 > StreamAudit-Training-1.1.0-universal-source.zip
          echo "e0eb4ff0df4811aace540f67323a2f39208fe9f734f8c09bdfdf3c6e62d4ae9c  StreamAudit-Training-1.1.0-universal-source.zip" | sha256sum -c -
          unzip -q StreamAudit-Training-1.1.0-universal-source.zip
          sed -i 's/ android:useController="false"//g' streamaudit_universal_v1_1/app/src/main/res/layout/activity_multiview.xml
          test -f streamaudit_universal_v1_1/app/build.gradle
          test -f streamaudit_universal_v1_1/app/src/main/AndroidManifest.xml

      - name: Build universal Android + Fire TV APK
        working-directory: streamaudit_universal_v1_1
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=streamaudit_universal_v1_1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: StreamAudit-Universal-1.1.0-APK
          path: streamaudit_universal_v1_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
