<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1B33">
<title>Education Plus Group — Smart Website Rebuild v4</title>
<style>
html,body{margin:0;min-height:100%;background:#0A1B33;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.load{width:min(440px,calc(100% - 40px));text-align:center}.mark{width:54px;height:54px;border:3px solid rgba(255,255,255,.16);border-top-color:#C99A2E;border-radius:50%;margin:0 auto 16px;animation:s .85s linear infinite}.load b{font-family:Georgia,serif;font-size:24px}.load p{color:#d8e1eb;font-size:13px;line-height:1.5}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="load"><div class="mark"></div><b>Education Plus</b><p>Opening the Smart Website review…</p></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('This preview requires a current browser.');
    const files=['ep-v4/part-01.b64','ep-v4/part-02.b64','ep-v4/part-03.b64','ep-v4/part-04.b64','ep-v4/part-05.b64'];
    const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Preview asset '+r.status);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const raw=atob(b64), bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(err){
    document.body.innerHTML='<div class="load"><b>Education Plus</b><p>The review could not open in this browser.</p><p>'+String(err.message||err)+'</p></div>';
  }
})();
</script>
</body>
</html>
