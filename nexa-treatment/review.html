<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Education Plus — Nexa Treatment Review</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#0a1d3b;color:#fff;display:grid;place-items:center;min-height:100vh}.loading{max-width:520px;padding:32px;text-align:center}.loading b{display:block;font-size:20px;margin-bottom:8px}.loading span{opacity:.7;font-size:14px}</style></head><body><div class="loading"><b>Loading Education Plus</b><span>Preparing the Nexa Treatment review build…</span></div><script>
(async()=>{
  try{
    let html=await (await fetch('./index.html',{cache:'no-store'})).text();
    html=html.replace('.btn-ghost{background:transparent;color:var(--navy);border:1px solid rgba(255,255,255,.27)}','.btn-ghost{background:transparent;color:var(--navy);border:1px solid rgba(255,255,255,.27)} .hero .btn-ghost,.navy .btn-ghost{color:#fff}');
    html=html.replace('.page{display:none}\n    .page.active{display:block}', '.page{display:none;padding:0}\n    .page.active{display:block}');
    html=html.replace("window.scrollTo({top:0,behavior:'instant'})", "window.scrollTo({top:0,behavior:'auto'})");
    html=html.replace("function routeFromHash(){const raw=location.hash.replace('#','').split('?')[0];showPage(pages.includes(raw)?raw:'home');}", "function routeFromHash(){const raw=location.hash.replace('#','').split('?')[0];if(raw==='main')return;if(raw==='explore'){showPage('home');setTimeout(()=>document.getElementById('explore')?.scrollIntoView({behavior:'smooth'}),20);return;}showPage(pages.includes(raw)?raw:'home');}");
    html=html.replace("function openFinder(a){answers=a?{audience:a}:{};modal.classList.add('open');document.body.style.overflow='hidden';renderFinder();setTimeout(()=>document.getElementById('closeFinder').focus(),30)}", "function openFinder(a){answers=a?{audience:a}:{};document.querySelector('.mobile-menu').style.display='none';mobileToggle.setAttribute('aria-expanded','false');modal.classList.add('open');document.body.style.overflow='hidden';renderFinder();setTimeout(()=>document.getElementById('closeFinder').focus(),30)}");
    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<div class="loading"><b>Review build could not load.</b><span>Please refresh this page.</span></div>';console.error(err)}
})();
</script></body></html>
