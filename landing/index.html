<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Education Plus</title>
<meta name="description" content="Education Plus — one group, five specialist education services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#07192f;
  --navy2:#0a1f3b;
  --royal:#2c6fcf;
  --cyan:#36a9c8;
  --gold:#d3ab47;
  --gold2:#f0d07a;
  --white:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy)}
body{
  min-height:100svh;
  overflow-x:hidden;
  color:var(--white);
  font-family:"Source Sans 3",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.page{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:max(22px,env(safe-area-inset-top)) 20px max(26px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 28%,rgba(46,111,207,.10),transparent 31%),
    linear-gradient(180deg,#07192f 0%,#081d37 55%,#07192f 100%);
}
.bg-motif{
  position:absolute;
  top:50%;
  width:min(27vw,360px);
  opacity:.11;
  filter:saturate(.75);
  pointer-events:none;
  user-select:none;
}
.bg-motif.left{left:-5.5vw;transform:translateY(-50%)}
.bg-motif.right{right:-5.5vw;transform:translateY(-50%)}
.orbit-wrap{
  position:relative;
  width:min(92vw,900px);
  aspect-ratio:1000/720;
  flex:0 1 auto;
  margin-top:-2vh;
}
.orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit-track{
  fill:none;
  stroke:rgba(211,171,71,.26);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
}
.orbit-track-blue{
  fill:none;
  stroke:rgba(54,169,200,.13);
  stroke-width:1;
  stroke-dasharray:6 13;
  vector-effect:non-scaling-stroke;
}
.orbit-current{
  fill:none;
  stroke:url(#signal);
  stroke-width:3.1;
  stroke-linecap:round;
  stroke-dasharray:60 1760;
  vector-effect:non-scaling-stroke;
  animation:signalFlow 9s linear infinite;
  filter:url(#softGlow);
}
.orbit-current.second{animation-delay:-4.5s;opacity:.62;stroke-width:2.2}
@keyframes signalFlow{to{stroke-dashoffset:-1820}}
.core{
  position:absolute;
  left:50%;
  top:43.1%;
  transform:translate(-50%,-50%);
  width:clamp(138px,18.2vw,214px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  z-index:5;
}
.core::before{
  content:"";
  position:absolute;
  inset:-15%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(211,171,71,.12),rgba(44,111,207,.05) 44%,transparent 69%);
  filter:blur(2px);
}
.core img{
  position:relative;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 18px 34px rgba(0,0,0,.28));
}
.service-node{
  position:absolute;
  width:clamp(52px,6.4vw,78px);
  height:clamp(52px,6.4vw,78px);
  margin-left:calc(clamp(52px,6.4vw,78px) / -2);
  margin-top:calc(clamp(52px,6.4vw,78px) / -2);
  z-index:7;
  display:grid;
  place-items:center;
  outline:none;
}
.service-orb{
  width:100%;
  height:100%;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(7,25,47,.84);
  border:1px solid rgba(240,208,122,.7);
  box-shadow:0 8px 24px rgba(0,0,0,.26),0 0 0 7px rgba(211,171,71,.035);
  transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
  backdrop-filter:blur(6px);
}
.service-orb img{width:84%;height:84%;object-fit:contain;border-radius:50%}
.service-label{
  position:absolute;
  top:calc(100% + 8px);
  left:50%;
  transform:translate(-50%,4px);
  opacity:0;
  white-space:nowrap;
  padding:5px 8px;
  border:1px solid rgba(240,208,122,.26);
  border-radius:999px;
  background:rgba(7,25,47,.86);
  color:rgba(255,255,255,.86);
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  transition:opacity .2s ease,transform .2s ease;
  pointer-events:none;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}
.service-node:hover .service-orb,
.service-node:focus-visible .service-orb{
  transform:scale(1.08);
  border-color:var(--gold2);
  box-shadow:0 10px 30px rgba(0,0,0,.31),0 0 0 8px rgba(211,171,71,.07);
}
.service-node:hover .service-label,
.service-node:focus-visible .service-label{opacity:1;transform:translate(-50%,0)}
.identity{
  position:relative;
  z-index:9;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  margin-top:clamp(-34px,-2.2vw,-12px);
}
.identity-kicker{
  color:var(--gold2);
  font:700 10px/1 "Source Sans 3",Arial,sans-serif;
  letter-spacing:.29em;
  text-transform:uppercase;
  margin-bottom:9px;
}
.wordmark{
  width:min(86vw,1120px);
  max-height:240px;
  object-fit:contain;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.12));
}
.gold-rule{
  width:min(78vw,980px);
  height:2px;
  margin-top:-10px;
  background:linear-gradient(90deg,transparent 0%,rgba(211,171,71,.92) 12%,var(--gold2) 50%,rgba(211,171,71,.92) 88%,transparent 100%);
  box-shadow:0 0 18px rgba(211,171,71,.22);
}
.contact{
  position:relative;
  z-index:10;
  margin-top:clamp(34px,5.5vh,72px);
  text-align:center;
}
.mail-label{
  display:inline-flex;
  align-items:baseline;
  justify-content:center;
  gap:0;
  color:var(--gold2);
  font:700 12px/1 "Source Sans 3",Arial,sans-serif;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:9px;
}
.mail-label .e{display:inline-block;margin-right:.04em}
.mail-label .dash{display:inline-block;margin:0 .20em 0 .12em;opacity:.72}
.mail-label .mail{display:inline-block;letter-spacing:.24em}
.contact a{
  display:inline-block;
  color:rgba(255,255,255,.92);
  font:600 clamp(15px,1.6vw,20px)/1.2 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.025em;
  border-bottom:1px solid rgba(211,171,71,.34);
  padding-bottom:4px;
  transition:color .2s ease,border-color .2s ease;
}
.contact a:hover,.contact a:focus-visible{color:#fff;border-color:var(--gold2)}
.footer-note{
  margin-top:16px;
  color:rgba(255,255,255,.38);
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
@media(max-width:700px){
  .page{justify-content:flex-start;padding-top:24px}
  .bg-motif{width:58vw;opacity:.075}
  .bg-motif.left{left:-24vw}
  .bg-motif.right{right:-24vw}
  .orbit-wrap{width:100vw;max-width:520px;margin-top:8px;aspect-ratio:1/1}
  .core{top:50%;width:clamp(126px,35vw,162px)}
  .identity{margin-top:-28px;padding:0 10px}
  .identity-kicker{font-size:8px;letter-spacing:.22em;margin-bottom:3px}
  .wordmark{width:94vw;max-height:180px}
  .gold-rule{width:82vw;margin-top:-7px}
  .contact{margin-top:46px}
  .contact a{font-size:17px}
  .service-label{font-size:8px;padding:4px 6px;opacity:.86;transform:translate(-50%,0)}
}
@media(max-height:760px) and (min-width:701px){
  .page{padding-top:12px;padding-bottom:16px}
  .orbit-wrap{width:min(78vw,720px);margin-top:-4vh}
  .identity{margin-top:-44px}
  .wordmark{width:min(72vw,900px);max-height:170px}
  .contact{margin-top:28px}
  .footer-note{margin-top:10px}
}
@media(prefers-reduced-motion:reduce){
  .orbit-current,.orbit-current.second{animation:none}
}
</style>
</head>

<script>
(() => {
  const stage=document.querySelector('.orbit-wrap');
  const nodes=[...document.querySelectorAll('.service-node')];
  const cx=500, cy=310, rx=365, ry=226;
  const tau=Math.PI*2;
  const step=tau/nodes.length;
  let phase=-Math.PI/2;
  let last=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  function place(){
    nodes.forEach((node,i)=>{
      const a=phase+i*step;
      node.style.left=((cx+rx*Math.cos(a))/10)+'%';
      node.style.top=((cy+ry*Math.sin(a))/7.2)+'%';
    });
  }
  function tick(now){
    const dt=Math.min(50,now-last)/1000;
    last=now;
    if(!reduce.matches){
      phase=(phase+dt*(tau/120))%tau;
    }
    place();
    requestAnimationFrame(tick);
  }
  place();
  requestAnimationFrame(tick);
})();
</script>
