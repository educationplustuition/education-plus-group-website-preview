<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Clarity Series — Loading</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f4ec;color:#0b4167;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:30px;text-align:center}.spin{width:36px;height:36px;border:4px solid #d9e2e8;border-top-color:#d59a16;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><h1>Teacher Clarity Series</h1><p>Loading the interactive publication…</p></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This browser needs a newer version to open the interactive publication.');const parts=[];for(let i=1;i<=8;i++){const r=await fetch(`./data/teacher-${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('Publication data could not be loaded.');parts.push(await r.text());}const b64=parts.join('').trim();const bin=atob(b64);const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.querySelector('.box').innerHTML='<h1>Teacher Clarity Series</h1><p>'+e.message+'</p><p>Please refresh the page or try Chrome, Edge, Safari or Firefox.</p>';}})();</script></body></html>
